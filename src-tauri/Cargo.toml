[package]
name = "join-approver"
version = "0.1.1"
description = "Approve Telegram channel join requests, and prove each one landed"
authors = ["The Uploading Lab"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "join_approver_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust MTProto. The session crate's default SQLite storage is left out:
# it drags in a C library, and the session here is a small JSON file.
grammers-client = { version = "0.10", default-features = false }
grammers-session = { version = "0.10", default-features = false, features = ["serde"] }
grammers-mtsender = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
log = "0.4"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Size first: this is a small utility, not a hot loop.
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
