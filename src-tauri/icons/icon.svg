<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb0ff"/>
      <stop offset="1" stop-color="#1765d8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#062a66" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- macOS Big Sur grid: 824px squircle centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <g filter="url(#shadow)" fill="#fff">
    <!-- a person, and a check: someone let in -->
    <circle cx="430" cy="395" r="112"/>
    <path d="M250 742c0-112 81-190 180-190 64 0 118 30 150 80-40 22-68 64-68 112 0 0 0 0 0 0z" />
  </g>
  <circle cx="650" cy="660" r="150" fill="#fff" filter="url(#shadow)"/>
  <path d="M582 662l48 48 92-100" fill="none" stroke="#1f9d47" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
